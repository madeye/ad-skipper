android.useAndroidX=true
android.nonTransitiveRClass=false
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true

# Gradle (JVM) does not honor *_PROXY env vars — this machine needs the local
# proxy to reach dl.google.com etc. Direct CN mirrors are still listed in the
# repositories as fallback.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1|maven.aliyun.com|modelscope.cn
systemProp.https.nonProxyHosts=localhost|127.0.0.1|maven.aliyun.com|modelscope.cn
